# ── Observability Stack ────────────────────────────────────────────────────────
#
# Both apps (app3=photoact :8081, app1=cinetopia :8082) run in Docker on the
# "internal" network defined in the main docker-compose.yml.
# Prometheus joins that same network so it can reach the containers by their
# Docker service names (app3, app1) — no host.docker.internal needed.
#
# ── ONE-TIME SETUP REQUIRED IN YOUR MAIN docker-compose.yml ──────────────────
# The "internal" network must have a fixed name so this compose can reference it.
# Add  name: photoact-internal  under the internal network definition:
#
#   networks:
#     internal:
#       driver: bridge
#       name: photoact-internal    ← add this line
#
# Then recreate the network:
#   docker compose down
#   docker compose up -d
#
# ── Start / Stop ──────────────────────────────────────────────────────────────
# Start:   docker compose -f docker-compose.observability.yml up -d
# Stop:    docker compose -f docker-compose.observability.yml down
# Logs:    docker compose -f docker-compose.observability.yml logs -f
#
# ── Access ─────────────────────────────────────────────────────────────────────
# Ports are bound to 127.0.0.1 — access via SSH tunnel or nginx reverse proxy.
#   Grafana:    http://localhost:3000   (login: admin / GRAFANA_PASSWORD)
#   Prometheus: http://localhost:9090
#
# ── Recommended Grafana dashboard IDs (Dashboards → Import) ──────────────────
#   4701  - JVM (Micrometer)                 ← start here
#   6756  - Spring Boot Statistics
#  14282  - Spring Boot 3 Observability
#  12900  - Spring Boot HikariCP             ← connection pool
#  14930  - Docker & Container metrics (cAdvisor)
#    893  - Docker and System Monitoring
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── Prometheus ───────────────────────────────────────────────────────────────
  # Needs two networks:
  #   monitoring        → to reach grafana, cadvisor, node-exporter (same compose)
  #   photoact-internal → to reach app3 (photoact) and app1 (cinetopia) by name
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: photoact-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - monitoring
      - photoact-internal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Grafana ──────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.4.0
    container_name: photoact-grafana
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-changeme_in_dotenv}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_LOG_LEVEL=warn
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - monitoring
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── cAdvisor — Docker container CPU / memory / network metrics ───────────────
  # Reads Docker stats via socket + kernel filesystems — no app network needed.
  # Inner port 8080 is cAdvisor's own built-in web server (unrelated to app ports).
  # Mapped to host 8090 to avoid collision with anything on 8080.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: photoact-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    ports:
      - "127.0.0.1:8090:8080"
    networks:
      - monitoring
    command:
      - '--housekeeping_interval=15s'
      - '--max_housekeeping_interval=30s'
      - '--docker_only=true'
      - '--store_container_labels=false'

  # ── Node Exporter — host CPU / memory / disk / filesystem metrics ─────────────
  # Reads /proc and /sys from the host — no app network needed.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: photoact-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.disable-defaults'
      - '--collector.cpu'
      - '--collector.loadavg'
      - '--collector.meminfo'
      - '--collector.diskstats'
      - '--collector.filesystem'
      - '--collector.netdev'
      - '--collector.uname'
      - '--collector.time'
    ports:
      - "127.0.0.1:9100:9100"
    networks:
      - monitoring

networks:

  # Internal network for Prometheus ↔ Grafana ↔ cAdvisor ↔ Node Exporter
  monitoring:
    driver: bridge

  # Shared with the main docker-compose so Prometheus can reach app3 and app1
  # by their Docker service names (app3:8081, app1:8082).
  # Requires  name: photoact-internal  in the main docker-compose.yml (see top).
  photoact-internal:
    external: true
    name: photoact-internal

volumes:
  prometheus_data:
  grafana_data:
