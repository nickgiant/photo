# nginx/vaadin-og.conf
#
# Place this file at:  /etc/nginx/sites-available/photoact.net
# Enable with:         sudo ln -s /etc/nginx/sites-available/photoact.net /etc/nginx/sites-enabled/
# Test:                sudo nginx -t
# Reload:              sudo systemctl reload nginx
#
# Requires certbot SSL cert:
#   sudo certbot --nginx -d photoact.net -d www.photoact.net
#
# ── What this config does ─────────────────────────────────────────────────────
#
#  1. Redirects HTTP → HTTPS and www → apex domain
#  2. Serves /static/ directly from filesystem (bypasses Java — fast CDN-like)
#  3. Detects social-media bots by User-Agent for content routes
#  4. Rewrites bot traffic from /{type}/{slug} → /og/{type}/{slug}
#     so the Spring OgMetaController returns pre-rendered OG HTML
#  5. Forwards all other traffic to Spring Boot (port 8080)
#
# ── Bot detection scope ───────────────────────────────────────────────────────
#  Routes matched:  /{type}/{slug}  where type is one of the content types
#  Root /           is handled by OG meta in index.html (no rewrite needed)

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name photoact.net www.photoact.net;
    return 301 https://photoact.net$request_uri;
}

# ── www → apex redirect ───────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.photoact.net;

    ssl_certificate     /etc/letsencrypt/live/photoact.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/photoact.net/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://photoact.net$request_uri;
}

# ── Main HTTPS server ─────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name photoact.net;

    ssl_certificate     /etc/letsencrypt/live/photoact.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/photoact.net/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Logging ──────────────────────────────────────────────────────────────
    access_log /var/log/nginx/photoact.net.access.log combined;
    error_log  /var/log/nginx/photoact.net.error.log  warn;

    # ── Tune for large photo uploads ─────────────────────────────────────────
    client_max_body_size 20M;

    # =========================================================================
    # LOCAL CDN — served directly by nginx, bypassing Java entirely
    # Cache strategy: 1 year immutable (filenames include UUID → no busting needed)
    # =========================================================================
    location /cdn/ {
        alias /var/www/photoact/cdn/;

        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        add_header Access-Control-Allow-Origin "*";
        autoindex off;
        access_log off;

        # WebP automatic serving: if browser sends Accept: image/webp and a .webp
        # file exists alongside the .jpg, serve it transparently.
        location ~* \.(jpg|jpeg|png)$ {
            add_header Vary "Accept";
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Access-Control-Allow-Origin "*";
        }
    }

    # Block direct access to originals (kept for reprocessing, not for public)
    location ~* ^/cdn/original/ {
        deny all;
        return 403;
    }

    # ── Static files served directly from filesystem ──────────────────────────
    # Default OG image, favicon, robots.txt, etc.
    # Spring Boot also serves /static/** as a fallback (WebConfig.java).
    location /static/ {
        alias /var/www/photoact/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    # ── Actuator security ─────────────────────────────────────────────────────
    # /actuator/health is allowed externally (load balancer / uptime monitor).
    # All other actuator endpoints are internal-only; Prometheus scrapes the app
    # directly on port 8081 (bypassing nginx) so they never need to be public.
    #
    # NOTE: nginx proxies to port 8081 (match server.port in application.properties).
    #       If your app still runs on 8080 update the port here and in location / below.
    location = /actuator/health {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location ^~ /actuator/ {
        deny all;
        return 403;
    }

    # ── Bot detection: content routes /{type}/{slug} ─────────────────────────
    # Rewrites social crawler traffic to /og/{type}/{slug} so Spring returns
    # pre-rendered OG HTML instead of the empty Vaadin SPA shell.
    #
    # Content types: photographer, album, photo, event, learning, article, story, news
    # Threads uses the same facebookexternalhit UA as Facebook.
    location ~ ^/(photographer|album|photo|event|learning|article|story|news)/([^/?]+)$ {
        set $is_bot 0;

        # Facebook / Instagram
        if ($http_user_agent ~* "facebookexternalhit|Facebot") { set $is_bot 1; }
        # Twitter / X
        if ($http_user_agent ~* "Twitterbot") { set $is_bot 1; }
        # LinkedIn
        if ($http_user_agent ~* "LinkedInBot|Linkedinbot") { set $is_bot 1; }
        # Pinterest
        if ($http_user_agent ~* "Pinterest|Pinterestbot") { set $is_bot 1; }
        # Slack
        if ($http_user_agent ~* "Slackbot|Slack-ImgProxy") { set $is_bot 1; }
        # Discord
        if ($http_user_agent ~* "Discordbot") { set $is_bot 1; }
        # Telegram
        if ($http_user_agent ~* "TelegramBot") { set $is_bot 1; }
        # WhatsApp
        if ($http_user_agent ~* "WhatsApp") { set $is_bot 1; }
        # Google (for indexing rich results)
        if ($http_user_agent ~* "Googlebot|Google-InspectionTool") { set $is_bot 1; }
        # Bing
        if ($http_user_agent ~* "bingbot|BingPreview") { set $is_bot 1; }
        # Apple iMessage link preview
        if ($http_user_agent ~* "Applebot") { set $is_bot 1; }
        # Reddit
        if ($http_user_agent ~* "redditbot|Reddit") { set $is_bot 1; }
        # WhatsApp
        if ($http_user_agent ~* "WhatsApp") { set $is_bot 1; }
        # Generic link previewers
        if ($http_user_agent ~* "Embedly|Quora|outbrain|W3C_Validator") { set $is_bot 1; }

        if ($is_bot = 1) {
            rewrite ^/(.+)$ /og/$1 last;
        }

        # Not a bot — forward to Vaadin SPA
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── All other traffic → Spring Boot ──────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
