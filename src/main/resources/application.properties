spring.application.name=photoact.net

server.port=8081

server.tomcat.remoteip.remote-ip-header=X-Real-IP
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
# https://runebook.dev/en/articles/spring_boot/application-properties/application-properties.server.server.tomcat.remoteip.protocol-header

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=16MB
spring.servlet.multipart.file-size-threshold = 4MB


spring.devtools.add-properties = false
logging.level.org.atmosphere = warn
#logging.level.web = DEBUG

# Base URL used to build canonical og:url values
# Change to your production domain before deploying




# ── Actuator / Observability ──────────────────────────────────────────────────
# Expose endpoints — prometheus is scraped internally (bypasses nginx), never public
management.endpoints.web.exposure.include=health,info,metrics,prometheus,caches,loggers,threaddump,heapdump
management.endpoints.web.base-path=/actuator

# Health details (safe: /actuator/* is blocked in nginx except /actuator/health)
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
# Liveness + readiness probes for Docker / orchestrators
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.health.db.enabled=true
management.health.redis.enabled=true
management.health.diskSpace.enabled=true
management.health.diskSpace.threshold=500MB

# Prometheus scrape format (Micrometer registry)
management.prometheus.metrics.export.enabled=true
management.prometheus.metrics.export.step=15s

# Common labels applied to every metric
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${APP_ENV:production}

# HTTP request latency: histograms + SLO buckets + percentiles
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.75,0.95,0.99
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,500ms,1s,2s

# HikariCP connection pool latency percentiles
management.metrics.distribution.percentiles.hikaricp.connections.acquire=0.5,0.95,0.99
management.metrics.distribution.percentiles.hikaricp.connections.usage=0.5,0.95,0.99

# Info endpoint enrichment
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
management.info.build.enabled=true
info.app.name=${spring.application.name}
info.app.description=Photo sharing platform

