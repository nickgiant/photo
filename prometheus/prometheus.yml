global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    environment: production
    application: photoact.net

scrape_configs:

  # ── Spring Boot application ────────────────────────────────────────────────
  # Prometheus scrapes the app directly on port 8081, bypassing nginx.
  # This is why /actuator/prometheus does NOT need to be publicly reachable.
  - job_name: spring-boot
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets:
          - host.docker.internal:8081
        labels:
          service: photoact-app

  # ── Docker container resource metrics (cAdvisor) ───────────────────────────
  - job_name: cadvisor
    scrape_interval: 30s
    static_configs:
      - targets:
          - cadvisor:8080
        labels:
          service: docker-containers

  # ── Host OS metrics (Node Exporter) ───────────────────────────────────────
  - job_name: node-exporter
    scrape_interval: 30s
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          service: host-system

  # ── Prometheus self-monitoring ─────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
